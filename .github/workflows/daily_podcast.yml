name: Update Podcasts (Tor Complete)

on:
schedule:
# Heures UTC : 4h, 12h, 20h
- cron: '0 4,12,20 * * *'
workflow_dispatch:

permissions:
contents: write

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout code
# Mise à jour vers v4 pour éviter les avertissements d'obsolescence Node.js
uses: actions/checkout@v4
with:
fetch-depth: 0

- name: Setup Python
  # Mise à jour vers v5
  uses: actions/setup-python@v5
  with:
    python-version: '3.10'
    
- name: Install System Dependencies & Tor
  run: |
    sudo apt-get update
    # Ajout de net-tools qui est requis pour la commande netstat plus bas
    sudo apt-get install -y ffmpeg tor net-tools

- name: Install Python Libraries
  run: |
    python -m pip install --upgrade pip
    # 1. On installe d'abord les dépendances fixes en ignorant le cache (évite de rester bloqué)
    pip install --no-cache-dir -r requirements.txt --upgrade
    
    # 2. CRITIQUE : On force l'installation de yt-dlp depuis master APRÈS requirements.txt
    # Cela garantit qu'aucune version PyPI plus ancienne ne viendra écraser la version master.
    pip install --no-cache-dir --force-reinstall https://github.com/yt-dlp/yt-dlp/archive/master.zip

# --- TOR CONFIGURATION ROBUSTE ---
- name: Configure Tor (Open Control)
  run: |
    # 1. Arrêter Tor (lancé auto par apt)
    sudo service tor stop || true
    
    # 2. Écrire une configuration PROPRE et COMPLETE
    sudo bash -c 'cat > /etc/tor/torrc << EOF
    SocksPort 9050
    ControlPort 9051
    CookieAuthentication 0
    HashedControlPassword ""
    Log notice stdout
    DataDirectory /var/lib/tor
    RunAsDaemon 1
    EOF'
    
    # 3. Réparer les permissions
    sudo chown -R debian-tor:debian-tor /var/lib/tor
    sudo chmod 700 /var/lib/tor
    
    # 4. Redémarrer Tor proprement
    sudo service tor start
    
    echo "Démarrage de Tor... (Pause de sécurité 45s)"
    sleep 45
    
    # 5. VERIFICATION
    if ! sudo netstat -tuln | grep ':9051'; then
      echo "ERREUR FATALE: Le port 9051 n'est pas ouvert !"
      sudo cat /var/log/syslog | grep Tor | tail -n 20
      exit 1
    fi
    
    echo "Test de connexion Tor (IP Initiale)..."
    curl -s --socks5 127.0.0.1:9050 https://api.ipify.org || echo "Attention: Tor lent au démarrage."

- name: Run Script via Tor
  env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    YOUTUBE_PROXY: "socks5://127.0.0.1:9050"
  run: python podcast_gen.py
  
- name: Commit and Push Changes
  if: always() 
  run: |
    git config --global user.name 'Bot'
    git config --global user.email 'bot@noreply.github.com'
    git add .
    if git diff --staged --quiet; then
      echo "Rien à commiter."
    else
      git commit -m "Update RSS and Logs"
      git pull --rebase origin main
      git push
    fi
